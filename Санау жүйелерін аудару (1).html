<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Санау жүйелері</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f9;--fg:#1d2433;--card:#fff;--bd:#d9dde8;--ac:#2f5bd8;--mu:#69728a;--ok:#1a7a3a;--er:#c0392b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--fg:#e8eaf2;--card:#1d2230;--bd:#323955;--ac:#7c9cff;--mu:#9aa3bd;--ok:#5fd08a;--er:#ff7b6b}}
:root[data-theme="dark"]{--bg:#14171f;--fg:#e8eaf2;--card:#1d2230;--bd:#323955;--ac:#7c9cff;--mu:#9aa3bd;--ok:#5fd08a;--er:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:1.3rem;margin:.2em 0 .6em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{font-size:.85rem;color:var(--mu);display:block;margin-bottom:4px}
input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;min-height:46px}
#num{font:1.3rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
.sel{display:grid;grid-template-columns:1fr 46px 1fr;gap:8px;align-items:end;margin:10px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:10px 12px;min-height:46px;font-weight:600}
.go{background:var(--ac);color:#fff;border-color:var(--ac);width:100%}
.res{margin-top:10px;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--bd)}
.res b{font:1.35rem/1.3 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:var(--ok)}
.err{color:var(--er)}
table{width:100%;border-collapse:collapse}
td{border-bottom:1px solid var(--bd);padding:8px 4px;vertical-align:top}
td:last-child{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;text-align:right}
.mu{color:var(--mu);font-size:.85rem}
.steps{font:.88rem/1.6 ui-monospace,Menlo,Consolas,monospace;word-break:break-word}
.ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ex button{min-height:36px;padding:4px 10px;font-weight:400;font-size:.85rem}
</style></head><body><main>
<h1>🔢 Санау жүйелерін аудару</h1>
<div class="card">
 <label for="num">Санды жазыңыз</label>
 <input id="num" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Мысалы: 1011 немесе 2F">
 <div class="sel">
  <div><label for="from">Қай жүйеден</label><select id="from"></select></div>
  <button id="sw" title="Жүйелерді ауыстыру" aria-label="Жүйелерді ауыстыру">⇄</button>
  <div><label for="to">Қай жүйеге</label><select id="to"></select></div>
 </div>
 <button class="go" id="go">🔄 Аудару</button>
 <div class="ex"><span class="mu">Мысал:</span><button data-e="1011|2|10">1011₂</button><button data-e="255|10|16">255₁₀</button><button data-e="777|8|2">777₈</button><button data-e="FF.8|16|10">FF.8₁₆</button></div>
 <div id="res" class="res" style="display:none"></div>
</div>
<div class="card" id="allc" style="display:none">
 <b>Барлық жүйеде:</b>
 <table id="all"></table>
</div>
<div class="card" id="stc" style="display:none">
 <b>Шешу жолы:</b>
 <div class="steps" id="steps"></div>
</div>
<script>
const $=i=>document.getElementById(i);
const SYS=[[2,'Екілік (2)'],[8,'Сегіздік (8)'],[10,'Ондық (10)'],[16,'Он алтылық (16)']];
const NAME={2:'Екілік',8:'Сегіздік',10:'Ондық',16:'Он алтылық'};
const SUB=n=>String(n).split('').map(c=>'₀₁₂₃₄₅₆₇₈₉'[c]).join('');
['from','to'].forEach(id=>$(id).innerHTML=SYS.map(([b,t])=>`<option value="${b}">${t}</option>`).join(''));
$('from').value='10';$('to').value='2';
const D='0123456789ABCDEF';

function parse(s,b){
 s=s.trim().toUpperCase().replace(',','.').replace(/\s+/g,'');
 if(!s)throw'Санды жазыңыз.';
 let neg=false;if(s[0]==='-'){neg=true;s=s.slice(1)}else if(s[0]==='+')s=s.slice(1);
 const [ip,fp='']=s.split('.');if(s.split('.').length>2)throw'Нүкте бір реттен артық болмауы керек.';
 if(!ip&&!fp)throw'Санды дұрыс жазыңыз.';
 const ok=D.slice(0,b);
 for(const c of ip+fp)if(!ok.includes(c))throw `«${c}» таңбасы ${NAME[b].toLowerCase()} жүйеде жоқ. Рұқсат етілген цифрлар: ${ok.split('').join(' ')}.`;
 let I=0n;for(const c of ip)I=I*BigInt(b)+BigInt(D.indexOf(c));
 let f=0;for(let i=0;i<fp.length;i++)f+=D.indexOf(fp[i])/Math.pow(b,i+1);
 return{neg,I,f,ip:ip||'0',fp};
}
function fmt(p,b){
 let s=p.I.toString(b).toUpperCase(),approx=false;
 if(p.f>0){let f=p.f,o='';for(let i=0;i<12&&f>1e-12;i++){f*=b;const d=Math.floor(f+1e-12);o+=D[d];f-=d}
  if(f>1e-9)approx=true;if(o)s+='.'+o}
 return{text:(p.neg&&(p.I>0n||p.f>0)?'-':'')+s,approx};
}
function steps(p,fb,tb,res){
 if(p.fp)return 'Бөлшек бөлікті аудару үшін: бөлшек бөлік негізге көбейтіліп, бүтін бөлігі алынады.';
 let h='';
 if(fb===10){let n=p.I;if(n===0n)return '0';
  h=`${NAME[10]} → ${NAME[tb].toLowerCase()}: санды ${tb}-ге қалдықпен бөлеміз.<br>`;
  let c=0;const rem=[];while(n>0n&&c<60){const q=n/BigInt(tb),r=n%BigInt(tb);h+=`${n} : ${tb} = ${q}, қалдық ${D[Number(r)]}<br>`;rem.push(D[Number(r)]);n=q;c++}
  h+=`Қалдықтарды төменнен жоғары оқимыз: <b>${rem.reverse().join('')}</b>`;return h}
 const dg=p.ip.split(''),L=dg.length;
 h=`${NAME[fb]} → ондық: әр цифрды ${fb}-нің дәрежесіне көбейтіп қосамыз.<br>`;
 const terms=dg.map((c,i)=>`${c}·${fb}<sup>${L-1-i}</sup>`).join(' + '),vals=dg.map((c,i)=>(BigInt(D.indexOf(c))*BigInt(fb)**BigInt(L-1-i)).toString()).join(' + ');
 h+=`${terms}<br>= ${vals}<br>= <b>${p.I}</b>`;
 if(tb!==10)h+=`<br><br>Сосын ${p.I} саны ${NAME[tb].toLowerCase()} жүйеге ${tb}-ге бөлу арқылы аударылады. Нәтиже: <b>${p.I.toString(tb).toUpperCase()}</b>`;
 return h;
}
function run(){
 const fb=+$('from').value,tb=+$('to').value,r=$('res');r.style.display='block';
 try{
  const p=parse($('num').value,fb),o=fmt(p,tb);
  r.innerHTML=`<span class="mu">${$('num').value.trim().toUpperCase()}${SUB(fb)} =</span><br><b>${o.text}</b><span class="mu">${SUB(tb)}</span>${o.approx?'<br><span class="mu">Бөлшек бөлік жуықтап көрсетілген.</span>':''}`;
  $('all').innerHTML=SYS.map(([b])=>`<tr><td>${NAME[b]}${SUB(b)}</td><td>${fmt(p,b).text}</td></tr>`).join('');$('allc').style.display='block';
  $('steps').innerHTML=steps(p,fb,tb);$('stc').style.display='block';
 }catch(e){r.innerHTML=`<span class="err">⚠ ${typeof e==='string'?e:'Қате енгізілді.'}</span>`;$('allc').style.display=$('stc').style.display='none'}
}
$('go').onclick=run;
$('num').onkeydown=e=>{if(e.key==='Enter')run()};
$('sw').onclick=()=>{const a=$('from').value;$('from').value=$('to').value;$('to').value=a;if($('num').value.trim()&&$('res').style.display==='block')run()};
document.querySelector('.ex').onclick=e=>{const v=e.target.dataset.e;if(!v)return;const[a,b,c]=v.split('|');$('num').value=a;$('from').value=b;$('to').value=c;run()};
</script></body></html>
